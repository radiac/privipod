name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      # https://github.com/actions/checkout/releases/tag/v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      # https://github.com/astral-sh/setup-uv/releases/tag/v8.1.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - name: Install dependencies
        run: uv sync --group dev
      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium
      - name: Run tests
        run: uv run pytest tests/ --tracing retain-on-failure
      - name: Upload Playwright traces
        if: failure()
        # https://github.com/actions/upload-artifact/releases/tag/v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-traces
          path: test-results/
      - name: Upload coverage to Codecov
        # https://github.com/codecov/codecov-action/releases/tag/v6.0.0
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: radiac/privipod
